<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stone.eco CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#20242a}
header{height:55px;background:#fff;border-bottom:1px solid #ddd;padding:16px 22px;font-size:20px;font-weight:bold}
nav{position:fixed;top:55px;bottom:0;width:220px;background:#fff;border-right:1px solid #ddd;padding:15px}
nav button{display:block;width:100%;padding:13px;border:0;background:#fff;text-align:left;border-radius:7px;cursor:pointer;font-size:15px;margin-bottom:4px}
nav button:hover{background:#f0f2f4}
main{margin-left:220px;padding:25px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}
.num{font-size:28px;font-weight:bold;margin-top:8px}
.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:15px}
input,select{padding:11px;border:1px solid #ccc;border-radius:7px;width:100%;margin-bottom:10px}
.btn{background:#198754;color:#fff;border:0;border-radius:7px;padding:11px 16px;cursor:pointer}
.btn.red{background:#dc3545}
.btn.gray{background:#6c757d}
.btn.small{padding:7px 10px;margin:2px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}
th{background:#f5f5f5}
.status{float:right;font-size:14px;font-weight:normal}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.search{max-width:400px}
@media(max-width:700px){
nav{width:160px}
main{margin-left:160px;padding:12px}
.formgrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
Stone.eco CRM
<span id="status" class="status">Не подключено</span>
</header>

<nav>
<button onclick="show('dashboard')">🏠 Главная</button>
<button onclick="show('clients')">👥 Клиенты</button>
<button onclick="show('products')">📦 Товары</button>
<button onclick="show('sales')">💰 Продажи</button>
<button onclick="show('purchases')">🛒 Закупки</button>
<button onclick="show('production_plan')">🏭 Производство</button>
<button onclick="show('expenses')">💸 Расходы</button>
<button onclick="show('reports')">📊 Отчёты</button>
<button onclick="show('settings')">⚙️ Настройки</button>
</nav>

<main id="main"></main>

<script>
const SUPABASE_URL="https://tjlacpmsfyaavkladrvh.supabase.co";
let db=null;
let editingId=null;

function connect(){
 const key=localStorage.getItem("stone_key");
 if(key){
   db=supabase.createClient(SUPABASE_URL,key);
   document.getElementById("status").textContent="Подключено";
   return true;
 }
 document.getElementById("status").textContent="Не подключено";
 return false;
}

async function count(table){
 if(!db)return 0;
 const {count,error}=await db.from(table).select("*",{count:"exact",head:true});
 return error?0:count||0;
}

async function dashboard(){
 main.innerHTML=`
 <h1>Главная</h1>
 <div class="cards">
   <div class="card">Клиенты<div class="num" id="c1">0</div></div>
   <div class="card">Товары<div class="num" id="c2">0</div></div>
   <div class="card">Продажи<div class="num" id="c3">0</div></div>
   <div class="card">Закупки<div class="num" id="c4">0</div></div>
   <div class="card">Производство<div class="num" id="c5">0</div></div>
   <div class="card">Расходы<div class="num" id="c6">0</div></div>
 </div>
 <div class="panel">Stone.eco CRM — управление клиентами, товарами, продажами, закупками, производством и расходами.</div>`;

 if(db){
  c1.textContent=await count("clients");
  c2.textContent=await count("products");
  c3.textContent=await count("sales");
  c4.textContent=await count("purchases");
  c5.textContent=await count("production_plan");
  c6.textContent=await count("expenses");
 }
}

async function clients(){
 if(!db){
  main.innerHTML="<h1>Клиенты</h1><div class='panel'>Сначала подключите Supabase в разделе Настройки.</div>";
  return;
 }

 main.innerHTML=`
 <h1>Клиенты</h1>

 <div class="panel">
   <button class="btn" onclick="clientForm()">➕ Добавить клиента</button>
   <input class="search" id="clientSearch" placeholder="🔍 Поиск клиента..." oninput="filterClients()">
 </div>

 <div class="panel" id="clientFormBox" style="display:none"></div>

 <div class="panel">
   <table>
    <thead>
     <tr>
      <th>Имя / компания</th>
      <th>Телефон</th>
      <th>Тип клиента</th>
      <th>Адрес</th>
      <th>Действия</th>
     </tr>
    </thead>
    <tbody id="clientRows"></tbody>
   </table>
 </div>`;

 await loadClients();
}

let clientsData=[];

async function loadClients(){
 const {data,error}=await db.from("clients")
   .select("id,name,phone,client_type,address,created_at")
   .order("created_at",{ascending:false});

 if(error){
  clientRows.innerHTML="<tr><td colspan='5'>Ошибка загрузки: "+error.message+"</td></tr>";
  return;
 }

 clientsData=data||[];
 renderClients(clientsData);
}

function renderClients(data){
 const rows=document.getElementById("clientRows");
 if(!data.length){
  rows.innerHTML="<tr><td colspan='5'>Клиентов пока нет</td></tr>";
  return;
 }

 rows.innerHTML=data.map(c=>`
 <tr>
  <td>${esc(c.name)}</td>
  <td>${esc(c.phone||"")}</td>
  <td>${esc(c.client_type||"")}</td>
  <td>${esc(c.address||"")}</td>
  <td>
   <button class="btn small" onclick="editClient('${c.id}')">✏️</button>
   <button class="btn red small" onclick="deleteClient('${c.id}')">🗑️</button>
  </td>
 </tr>`).join("");
}

function filterClients(){
 const q=(document.getElementById("clientSearch").value||"").toLowerCase();
 renderClients(clientsData.filter(c=>
  (c.name||"").toLowerCase().includes(q) ||
  (c.phone||"").toLowerCase().includes(q) ||
  (c.address||"").toLowerCase().includes(q)
 ));
}

function clientForm(c=null){
 editingId=c?c.id:null;

 document.getElementById("clientFormBox").style.display="block";
 document.getElementById("clientFormBox").innerHTML=`
 <h2>${c?"Редактировать клиента":"Новый клиент"}</h2>

 <div class="formgrid">
  <div>
   <label>Имя / название компании *</label>
   <input id="f_name" value="${esc(c?.name||"")}" placeholder="Например: ОсОО Stone House">
  </div>

  <div>
   <label>Телефон</label>
   <input id="f_phone" value="${esc(c?.phone||"")}" placeholder="+996 ...">
  </div>

  <div>
   <label>Тип клиента</label>
   <select id="f_type">
    <option value="">Выберите тип</option>
    <option ${c?.client_type==="Частное лицо"?"selected":""}>Частное лицо</option>
    <option ${c?.client_type==="Компания"?"selected":""}>Компания</option>
    <option ${c?.client_type==="Оптовый клиент"?"selected":""}>Оптовый клиент</option>
    <option ${c?.client_type==="Дилер"?"selected":""}>Дилер</option>
   </select>
  </div>

  <div>
   <label>Адрес</label>
   <input id="f_address" value="${esc(c?.address||"")}" placeholder="Адрес">
  </div>
 </div>

 <button class="btn" onclick="saveClient()">💾 Сохранить</button>
 <button class="btn gray" onclick="closeClientForm()">Отмена</button>
 `;
}

function closeClientForm(){
 editingId=null;
 const box=document.getElementById("clientFormBox");
 if(box)box.style.display="none";
}

async function saveClient(){
 const name=document.getElementById("f_name").value.trim();

 if(!name){
  alert("Введите имя или название компании");
  return;
 }

 const obj={
  name:name,
  phone:document.getElementById("f_phone").value.trim(),
  client_type:document.getElementById("f_type").value,
  address:document.getElementById("f_address").value.trim()
 };

 let result;

 if(editingId){
  result=await db.from("clients").update(obj).eq("id",editingId);
 }else{
  result=await db.from("clients").insert(obj);
 }

 if(result.error){
  alert("Ошибка: "+result.error.message);
  return;
 }

 alert(editingId?"Клиент изменён":"Клиент добавлен");
 closeClientForm();
 await loadClients();
}

async function editClient(id){
 const c=clientsData.find(x=>x.id===id);
 if(c)clientForm(c);
}

async function deleteClient(id){
 const c=clientsData.find(x=>x.id===id);
 if(!c)return;

 if(!confirm("Удалить клиента «"+c.name+"»?"))return;

 const {error}=await db.from("clients").delete().eq("id",id);

 if(error){
  alert("Ошибка удаления: "+error.message);
  return;
 }

 await loadClients();
}
function formatStock(stock,minStock){
 const s=Number(stock)||0;
 const m=Number(minStock)||0;

 if(s<=0){
  return `<span style="color:#dc3545;font-weight:bold">${s}</span>`;
 }

 if(m>0 && s<=m){
  return `<span style="color:#fd7e14;font-weight:bold">${s}</span>`;
 }

 return `<span style="color:#198754;font-weight:bold">${s}</span>`;
}
function esc(v){
 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

async function simpleTable(table,title){
 if(table==="products"){
   products();
   return;
 }

 if(!db){
  main.innerHTML="<h1>"+title+"</h1><div class='panel'>Сначала подключите Supabase.</div>";
  return;
 }

 main.innerHTML="<h1>"+title+"</h1><div class='panel'>Раздел будет подключён следующим этапом.</div>";
}


let productsData=[];
let editingProductId=null;


async function products(){

 if(!db){
  main.innerHTML=`
   <h1>Товары</h1>
   <div class="panel">
    Сначала подключите Supabase в разделе Настройки.
   </div>`;
  return;
 }

 main.innerHTML=`
 <h1>📦 Товары</h1>

 <div class="panel">

   <button class="btn" onclick="productForm()">
    ➕ Добавить товар
   </button>

   <input
    class="search"
    id="productSearch"
    placeholder="🔍 Поиск товара..."
    oninput="filterProducts()"
   >

 </div>


 <div
  class="panel"
  id="productFormBox"
  style="display:none">
 </div>


 <div class="panel">

  <table>

   <thead>

    <tr>
     <th>Категория</th>
     <th>Название</th>
     <th>Ед.</th>
     <th>Себестоимость</th>
     <th>Цена продажи</th>
<th>Остаток</th>
<th>Мин. остаток</th>
     <th>Действия</th>
    </tr>

   </thead>

   <tbody id="productRows"></tbody>

  </table>

 </div>
 `;

 await loadProducts();
}


async function loadProducts(){

 const {data,error}=await db
  .from("products")
  .select("*")
  .order("name");

 if(error){

  document.getElementById("productRows").innerHTML=
   "<tr><td colspan='6'>Ошибка загрузки: "+
   esc(error.message)+
   "</td></tr>";

  return;
 }

 productsData=data||[];

 renderProducts(productsData);
}


function renderProducts(data){

 const rows=document.getElementById("productRows");

 if(!rows)return;

 if(!data.length){

  rows.innerHTML=
   "<tr><td colspan='6'>Товаров пока нет</td></tr>";

  return;
 }


 rows.innerHTML=data.map(p=>`

  <tr>

   <td>${esc(p.category||"")}</td>

   <td><b>${esc(p.name||"")}</b></td>

   <td>${esc(p.unit||"")}</td>

   <td>${formatMoney(p.cost)}</td>

   <td>${formatMoney(p.price??p.sale_price)}</td> <td>${formatStock(p.stock,p.min_stock)}</td> <td>${formatStock(p.min_stock)}</td>

   <td>

    <button
     class="btn small"
     onclick="editProduct('${p.id}')">
     ✏️
    </button>

    <button
     class="btn red small"
     onclick="deleteProduct('${p.id}')">
     🗑️
    </button>

   </td>

  </tr>

 `).join("");
}


function formatMoney(value){

 if(value===null || value===undefined || value===""){
  return "—";
 }

 return Number(value).toLocaleString("ru-RU")+" сом";
}


function filterProducts(){

 const input=document.getElementById("productSearch");

 if(!input)return;

 const q=(input.value||"").toLowerCase().trim();


 renderProducts(
  productsData.filter(p=>

   (p.name||"").toLowerCase().includes(q) ||

   (p.category||"").toLowerCase().includes(q) ||

   (p.unit||"").toLowerCase().includes(q)

  )
 );

}


function productForm(p=null){

 editingProductId=p?.id:null;


 const box=document.getElementById("productFormBox");

 box.style.display="block";


 box.innerHTML=`

 <h2>
  ${p?"✏️ Редактировать товар":"➕ Новый товар"}
 </h2>


 <div class="formgrid">

  <div>

   <label>Категория</label>

   <select id="p_category">

    <option value="">Выберите категорию</option>

    <option ${p?.category==="Термопанели"?"selected":""}>
     Термопанели
    </option>

    <option ${p?.category==="Гибкий камень"?"selected":""}>
     Гибкий камень
    </option>

    <option ${p?.category==="Мраморная крошка"?"selected":""}>
     Мраморная крошка
    </option>

    <option ${p?.category==="Клинкерная плитка"?"selected":""}>
     Клинкерная плитка
    </option>

    <option ${p?.category==="Другое"?"selected":""}>
     Другое
    </option>

   </select>

  </div>


  <div>

   <label>Название товара *</label>

   <input
    id="p_name"
    value="${esc(p?.name||"")}"
    placeholder="Например: Термопанель 25 мм">

  </div>


  <div>

   <label>Единица измерения</label>

   <select id="p_unit">

    <option value="">Выберите единицу</option>

    <option ${p?.unit==="м²"?"selected":""}>м²</option>

    <option ${p?.unit==="шт"?"selected":""}>шт</option>

    <option ${p?.unit==="кг"?"selected":""}>кг</option>

    <option ${p?.unit==="мешок"?"selected":""}>мешок</option>

    <option ${p?.unit==="пог.м"?"selected":""}>пог.м</option>

   </select>

  </div>


  <div>

   <label>Себестоимость, сом</label>

   <input
    id="p_cost"
    type="number"
    min="0"
    step="0.01"
    value="${p?.cost??""}"
    placeholder="0">

  </div>


  <div>

   <label>Цена продажи, сом</label>

   <input
    id="p_price"
    type="number"
    min="0"
    step="0.01"
    value="${p?.price??p?.sale_price??""}"
    placeholder="0">

  </div>

 </div>
<div>
  <label>Остаток</label>
  <input
    id="p_stock"
    type="number"
    min="0"
    step="0.01"
    value="${p?.stock??0}"
    placeholder="0">
</div>

<div>
  <label>Минимальный остаток</label>
  <input
    id="p_min_stock"
    type="number"
    min="0"
    step="0.01"
    value="${p?.min_stock??0}"
    placeholder="0">
</div>

 <button
  class="btn"
  onclick="saveProduct()">
  💾 Сохранить
 </button>

 <button
  class="btn gray"
  onclick="closeProductForm()">
  Отмена
 </button>

 `;

}


function closeProductForm(){

 editingProductId=null;

 const box=document.getElementById("productFormBox");

 if(box){
  box.style.display="none";
  box.innerHTML="";
 }

}


async function saveProduct(){

 const name=document
  .getElementById("p_name")
  .value
  .trim();


 if(!name){

  alert("Введите название товара");

  return;
 }


const obj={
 category:document
  .getElementById("p_category")
  .value,

 name:name,

 unit:document
  .getElementById("p_unit")
  .value,

 cost:Number(
  document.getElementById("p_cost").value
 )||0,

 price:Number(
  document.getElementById("p_price").value
 )||0,

 stock:Number(
  document.getElementById("p_stock").value
 )||0,

 min_stock:Number(
  document.getElementById("p_min_stock").value
 )||0
}; 

 let result;


if(editingProductId){

 result=await db
  .from("products")
  .update(obj)
  .eq("id",editingProductId)
  .select();


 }else{

  result=await db
   .from("products")
   .insert(obj);

 }


 if(result.error){

  alert("Ошибка: "+result.error.message);

  return;
 }


 alert(
  editingProductId
   ?"Товар изменён"
   :"Товар добавлен"
 );


 closeProductForm();

 await loadProducts();

}


function editProduct(id){

 const p=productsData.find(
  x=>x.id===id
 );

 if(p){
  productForm(p);
 }

}


async function deleteProduct(id){

 const p=productsData.find(
  x=>x.id===id
 );

 if(!p)return;


 if(!confirm(
  "Удалить товар «"+p.name+"»?"
 ))return;


 const {error}=await db
  .from("products")
  .delete()
  .eq("id",id);


 if(error){

  alert(
   "Ошибка удаления: "+
   error.message
  );

  return;
 }


 await loadProducts();

}
function reports(){
 main.innerHTML="<h1>Отчёты</h1><div class='panel'>Раздел отчётов будет подключён следующим этапом.</div>";
}

function settings(){
 main.innerHTML=`
 <h1>Настройки</h1>
 <div class="panel">
  <h2>Подключение CRM</h2>
  <p>Введите только <b>Publishable key</b> из Supabase → Settings → API Keys.</p>

  <label>Supabase URL</label>
  <input id="supabaseUrl" value="${SUPABASE_URL}">

  <label>Publishable key</label>
  <input id="supabaseKey" type="password" placeholder="sb_publishable_...">

  <button class="btn" onclick="saveSettings()">Подключить</button>

  <p>⚠️ Secret key сюда не вводите.</p>
 </div>`;
}

function saveSettings(){
 const key=document.getElementById("supabaseKey").value.trim();

 if(!key){
  alert("Введите Publishable key");
  return;
 }

 localStorage.setItem("stone_key",key);
 connect();
 alert("CRM подключена к Supabase");
 show("dashboard");
}

function show(page){
 if(page==="dashboard")dashboard();
 else if(page==="clients")clients();
 else if(page==="products")simpleTable("products","Товары");
 else if(page==="sales")simpleTable("sales","Продажи");
 else if(page==="purchases")simpleTable("purchases","Закупки");
 else if(page==="production_plan")simpleTable("production_plan","Производство");
 else if(page==="expenses")simpleTable("expenses","Расходы");
 else if(page==="reports")reports();
 else if(page==="settings")settings();
}

connect();
show("dashboard");
</script>

</body>
</html>
