<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stone.eco CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f6f8;color:#20242a}header{background:white;padding:16px 20px;border-bottom:1px solid #ddd;font-weight:bold}.wrap{display:flex;min-height:calc(100vh - 55px)}nav{width:220px;background:white;padding:12px;border-right:1px solid #ddd}nav button{display:block;width:100%;padding:13px;text-align:left;border:0;background:white;border-radius:8px;font-size:15px}nav button:hover{background:#eef5ee}main{padding:22px;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:16px}.num{font-size:28px;font-weight:bold;margin-top:8px}input{width:100%;padding:11px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #bbb;border-radius:7px}.btn{background:#198754;color:white;border:0;border-radius:7px;padding:11px 16px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){nav{width:65px}nav button{font-size:18px}nav button span{display:none}}
</style></head><body><header>🪨 Stone.eco CRM <span id="status" style="float:right;font-weight:normal">Не подключено</span></header><div class="wrap"><nav id="nav"></nav><main id="app"></main></div>
<script>
const URL0="https://tjlacpmsfyaavkladrvh.supabase.co";let db=null,current="dashboard";
const menu=[["dashboard","🏠","Главная"],["clients","👥","Клиенты"],["products","📦","Товары"],["sales","💰","Продажи"],["purchases","🛒","Закупки"],["production_plan","🏭","Производство"],["expenses","💸","Расходы"],["reports","📊","Отчёты"],["settings","⚙️","Настройки"]];
function nav(){document.getElementById("nav").innerHTML=menu.map(x=>`<button onclick="show('${x[0]}')">${x[1]} <span>${x[2]}</span></button>`).join("")}
async function count(t){if(!db)return 0;let r=await db.from(t).select("*",{count:"exact",head:true});return r.count||0}
async function show(id){current=id;nav();if(id==="settings")return settings();if(id==="dashboard"){app.innerHTML="<h1>Главная</h1><div class='cards' id='cards'></div><div class='panel'>Stone.eco CRM — управление клиентами, товарами, продажами, закупками, производством и расходами.</div>";let ts=["clients","products","sales","purchases","production_plan","expenses"],ns=["Клиенты","Товары","Продажи","Закупки","Производство","Расходы"],a=[];for(let t of ts)a.push(await count(t));cards.innerHTML=a.map((n,i)=>`<div class='card'>${ns[i]}<div class='num'>${n}</div></div>`).join("");return}let names={clients:"Клиенты",products:"Товары",sales:"Продажи",purchases:"Закупки",production_plan:"Производство",expenses:"Расходы",reports:"Отчёты"};app.innerHTML=`<h1>${names[id]}</h1><div class='panel'><button class='btn' onclick="load('${id}')">Загрузить данные</button></div><div id='data'></div>`}
async function load(t){if(!db)return settings();let r=await db.from(t).select("*").limit(100);if(r.error){data.innerHTML="<div class='panel'>Ошибка: "+r.error.message+"</div>";return}if(!r.data.length){data.innerHTML="<div class='panel'>Пока нет записей.</div>";return}let k=Object.keys(r.data[0]);data.innerHTML="<div class='panel'><table><tr>"+k.map(x=>"<th>"+x+"</th>").join("")+"</tr>"+r.data.map(row=>"<tr>"+k.map(x=>"<td>"+(row[x]??"")+"</td>").join("")+"</tr>").join("")+"</table></div>"}
function settings(){app.innerHTML=`<div class='panel' style='max-width:600px;margin:30px auto'><h1>Подключение CRM</h1><p>Введите только <b>Publishable key</b> из Supabase → Settings → API Keys.</p><label>Supabase URL</label><input id='url' value='${URL0}'><label>Publishable key</label><input id='key' type='password' placeholder='sb_publishable_...'><button class='btn' onclick='connect()'>Подключить</button><p>⚠️ Secret key сюда не вводите.</p></div>`}
function connect(){let u=url.value.trim(),k=key.value.trim();if(!k)return alert("Введите Publishable key");db=supabase.createClient(u,k);localStorage.setItem("stone_url",u);localStorage.setItem("stone_key",k);status.textContent="Подключено";show("dashboard")}
nav();let u=localStorage.getItem("stone_url"),k=localStorage.getItem("stone_key");if(u&&k){db=supabase.createClient(u,k);status.textContent="Подключено"}show("dashboard");
</script></body></html>
